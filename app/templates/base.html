<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>

    <!-- Global Inline CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #3498db;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            flex: 1; /* Pushes the footer to the bottom */
            width: 100%;
            box-sizing: border-box;
        }
        .footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: #bdc3c7;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <h2>Online Voting System</h2>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">Home</a>
            <a href="/admin/login">Admin Login</a>
        </div>
    </div>

    <!-- Main Content Injection Point -->
    <div class="container">
        {% block content %}
        <!-- Child templates (like signup.html) will inject their content here -->
        {% endblock %}
    </div>

    <!-- Global Footer -->
    <div class="footer">
        &copy; 2026 Online Voting System. Secure & Transparent Elections.
    </div>

</body>
</html>
