<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Voting System</title>

    <!-- Global Inline CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 0;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .navbar {
            background-color: #2c3e50;
            padding: 15px 30px;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .navbar h2 {
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }
        .nav-links a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-size: 16px;
            transition: color 0.3s;
        }
        .nav-links a:hover {
            color: #3498db;
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 20px;
            flex: 1; /* Pushes the footer to the bottom */
            width: 100%;
            box-sizing: border-box;
        }
        .footer {
            text-align: center;
            padding: 20px;
            background-color: #2c3e50;
            color: #bdc3c7;
            font-size: 14px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

    <!-- Top Navigation Bar -->
    <div class="navbar">
        <h2>Online Voting System</h2>
        <div class="nav-links">
            <a href="{{ url_for('main.index') }}">Home</a>

            <!-- These links toggle automatically based on context -->
            <a href="/admin/ui/login" id="navLoginBtn">Login</a>
            <a href="/admin/ui/signup" id="navSignupBtn" style="display: none;">Sign up</a>
            <a href="javascript:void(0);" id="navLogoutBtn" style="display: none;" onclick="handleLogout()">Logout</a>
        </div>
    </div>

    <!-- Main Content Injection Point -->
    <div class="container">
        {% block content %}
        <!-- Child templates (like signup.html) will inject their content here -->
        {% endblock %}
    </div>

    <!-- Global Footer -->
    <div class="footer">
        &copy; 2026 Online Voting System. Secure & Transparent Elections.
    </div>

    <!-- Global Authentication Script -->
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            const token = sessionStorage.getItem('login_token');
            const loginBtn = document.getElementById('navLoginBtn');
            const signupBtn = document.getElementById('navSignupBtn');
            const logoutBtn = document.getElementById('navLogoutBtn');
            const currentPath = window.location.pathname;

            if (token) {
                // Admin is logged in: Only show Logout
                if (loginBtn) loginBtn.style.display = 'none';
                if (signupBtn) signupBtn.style.display = 'none';
                if (logoutBtn) logoutBtn.style.display = 'inline-block';
            } else {
                // Admin is logged out: Hide Logout
                if (logoutBtn) logoutBtn.style.display = 'none';

                // Smart context switching for Login / Sign Up buttons
                if (currentPath === '/admin/ui/login') {
                    if (loginBtn) loginBtn.style.display = 'none';
                    if (signupBtn) signupBtn.style.display = 'inline-block';
                } else if (currentPath === '/admin/ui/signup') {
                    if (loginBtn) loginBtn.style.display = 'inline-block';
                    if (signupBtn) signupBtn.style.display = 'none';
                } else {
                    // Default for home page or other unauthenticated pages
                    if (loginBtn) loginBtn.style.display = 'inline-block';
                    if (signupBtn) signupBtn.style.display = 'none';
                }
            }
        });

        function handleLogout() {
            // Clear the login session and redirect
            sessionStorage.removeItem('login_token');
            sessionStorage.removeItem('admin_username');
            window.location.href = '/admin/ui/login';
        }
    </script>
</body>
</html>
