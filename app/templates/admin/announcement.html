{% extends 'base.html' %}

{% block content %}
<style>
    .container {
        max-width: 100% !important;
        padding: 0 40px !important;
        margin: 30px auto;
        font-family: Arial, sans-serif;
    }

    .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 2px solid #e2e8f0;
    }

    .page-header h2 {
        margin: 0;
        color: #1e293b;
        font-size: 28px;
    }

    .btn-add {
        background-color: #3498db;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
    }

    .btn-add:hover {
        background-color: #2980b9;
    }

    .table-container {
        background: #ffffff;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        overflow-x: auto;
        border-top: 4px solid #3498db;
    }

    table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
    }

    th, td {
        padding: 15px 20px;
        border-bottom: 1px solid #e2e8f0;
    }

    th {
        background-color: #f8fafc;
        color: #475569;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 13px;
        letter-spacing: 0.5px;
    }

    td {
        color: #334155;
        font-size: 14px;
        vertical-align: middle;
    }

    tr:hover {
        background-color: #f1f5f9;
    }

    .priority-badge {
        padding: 4px 10px;
        border-radius: 20px;
        font-size: 12px;
        font-weight: bold;
    }
    .priority-info { background-color: #dbeafe; color: #1e40af; }
    .priority-warning { background-color: #fef3c7; color: #b45309; }
    .priority-urgent { background-color: #fee2e2; color: #b91c1c; }

    .type-badge {
        background-color: #f1f5f9;
        color: #475569;
        padding: 4px 10px;
        border-radius: 4px;
        font-size: 12px;
        font-weight: 600;
        border: 1px solid #cbd5e1;
    }

    .btn-delete {
        background-color: #e74c3c;
        color: white;
        border: none;
        padding: 6px 12px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 12px;
        font-weight: bold;
        transition: background-color 0.2s;
    }

    .btn-delete:hover {
        background-color: #c0392b;
    }

    .modal-overlay {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background-color: rgba(0,0,0,0.5);
        z-index: 1000;
        justify-content: center;
        align-items: center;
    }

    .modal-content {
        background-color: white;
        padding: 30px;
        border-radius: 8px;
        width: 100%;
        max-width: 500px;
        box-shadow: 0 10px 25px rgba(0,0,0,0.1);
    }

    .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
    }

    .modal-header h3 {
        margin: 0;
        color: #2c3e50;
    }

    .close-btn {
        background: none;
        border: none;
        font-size: 20px;
        cursor: pointer;
        color: #7f8c8d;
    }

    .form-group {
        margin-bottom: 15px;
    }

    .form-group label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
        color: #2c3e50;
        font-size: 14px;
    }

    .form-group input, .form-group select, .form-group textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        font-size: 14px;
        box-sizing: border-box;
    }

    .form-group textarea {
        resize: vertical;
        height: 80px;
    }

    .form-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 25px;
    }

    .btn-cancel {
        background-color: #95a5a6;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
    }
    
    .btn-submit {
        background-color: #2ecc71;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: bold;
    }

    .alert {
        padding: 10px;
        margin-bottom: 15px;
        border-radius: 4px;
        display: none;
        font-size: 14px;
    }
    .alert-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .alert-error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
</style>

<div class="container">
    <div class="page-header">
        <h2>Announcement Management</h2>
        <button class="btn-add" onclick="openModal()">+ Add Announcement</button>
    </div>

    <div id="pageAlert" class="alert"></div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name / Description</th>
                    <th>Type</th>
                    <th>Priority</th>
                    <th>Election ID</th>
                    <th>Date</th>
                    <th style="text-align: right;">Actions</th>
                </tr>
            </thead>
            <tbody id="tableBody">
                <tr><td colspan="7" style="text-align: center;">Loading announcements...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<div class="modal-overlay" id="addModal">
    <div class="modal-content">
        <div class="modal-header">
            <h3>Add New Announcement</h3>
            <button class="close-btn" onclick="closeModal()">&times;</button>
        </div>
        
        <div id="modalAlert" class="alert"></div>

        <form id="announcementForm" onsubmit="submitAnnouncement(event)">
            <div class="form-group">
                <label>Title / Name</label>
                <input type="text" id="annoName" required placeholder="e.g. Voting Started">
            </div>
            
            <div class="form-group">
                <label>Description</label>
                <textarea id="annoDesc" required placeholder="Enter full announcement details..."></textarea>
            </div>
            
            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Type</label>
                    <select id="annoType" required>
                        <option value="PUBLIC">Public</option>
                        <option value="RESULT">Result</option>
                        <option value="ELECTION_START">Election Start</option>
                        <option value="ELECTION_END">Election End</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label>Priority</label>
                    <select id="annoPriority" required>
                        <option value="INFO">Info</option>
                        <option value="WARNING">Warning</option>
                        <option value="URGENT">Urgent</option>
                    </select>
                </div>
            </div>

            <div style="display: flex; gap: 15px;">
                <div class="form-group" style="flex: 1;">
                    <label>Election (Optional)</label>
                    <select id="annoElectionId">
                        <option value="">-- No Election --</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 2;">
                    <label>Action Link (Optional)</label>
                    <input type="url" id="annoLink" placeholder="http://...">
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-cancel" onclick="closeModal()">Cancel</button>
                <button type="submit" class="btn-submit">Save Announcement</button>
            </div>
        </form>
    </div>
</div>

<script>
    const token = sessionStorage.getItem('login_token');

    document.addEventListener('DOMContentLoaded', () => {
        if (!token) {
            window.location.href = '/admin/ui/login';
            return;
        }
        fetchAnnouncements();
        fetchElectionsForDropdown();
    });

    function openModal() {
        document.getElementById('addModal').style.display = 'flex';
        document.getElementById('announcementForm').reset();
        document.getElementById('modalAlert').style.display = 'none';
    }

    function closeModal() {
        document.getElementById('addModal').style.display = 'none';
    }

    async function fetchElectionsForDropdown() {
        try {
            const response = await fetch('/admin/api/get_elections', {
                headers: { 'token': token }
            });
            const data = await response.json();

            if (response.ok && data.status === 'success') {
                const select = document.getElementById('annoElectionId');
                select.innerHTML = '<option value="">-- No Election --</option>';

                data.data.forEach(election => {
                    const option = document.createElement('option');
                    option.value = election.id;
                    option.textContent = election.title;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error(error);
        }
    }

    async function fetchAnnouncements() {
        const tbody = document.getElementById('tableBody');
        try {
            const response = await fetch('/public/api/get_announcement');
            const data = await response.json();
            
            if (response.ok && data.status === 'success') {
                renderTable(data.data);
            } else {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;">Failed to load data</td></tr>`;
            }
        } catch (error) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:red;">Network Error</td></tr>`;
        }
    }

    function renderTable(announcements) {
        const tbody = document.getElementById('tableBody');
        tbody.innerHTML = '';

        if (announcements.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No announcements found</td></tr>`;
            return;
        }

        announcements.forEach(a => {
            if(a.is_deleted) return;

            const dateStr = new Date(a.ts).toLocaleString('en-IN', { dateStyle: 'medium', timeStyle: 'short' });
            
            let priorityClass = 'priority-info';
            if (a.priority === 'WARNING') priorityClass = 'priority-warning';
            if (a.priority === 'URGENT') priorityClass = 'priority-urgent';

            const tr = document.createElement('tr');
            tr.innerHTML = `
                <td><b>#${a.id}</b></td>
                <td>
                    <div style="font-weight:bold; margin-bottom:4px; color:#1e293b;">${a.name}</div>
                    <div style="color:#64748b; font-size:13px; max-width: 300px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${a.description}</div>
                </td>
                <td><span class="type-badge">${a.anno_type.replace('_', ' ')}</span></td>
                <td><span class="priority-badge ${priorityClass}">${a.priority}</span></td>
                <td>${a.election_id || '-'}</td>
                <td>${dateStr}</td>
                <td style="text-align: right;">
                    <button class="btn-delete" onclick="deleteAnnouncement(${a.id})">Delete</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    async function submitAnnouncement(e) {
        e.preventDefault();
        const alertBox = document.getElementById('modalAlert');
        
        const payload = {
            name: document.getElementById('annoName').value.trim(),
            description: document.getElementById('annoDesc').value.trim(),
            announcement_type: document.getElementById('annoType').value,
            priority: document.getElementById('annoPriority').value,
        };

        const electionId = document.getElementById('annoElectionId').value;
        if(electionId) payload.election_id = parseInt(electionId);

        const actionLink = document.getElementById('annoLink').value.trim();
        if(actionLink) payload.action_link = actionLink;

        try {
            const response = await fetch('/admin/api/add_announcement', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'token': token
                },
                body: JSON.stringify(payload)
            });

            const result = await response.json();

            if (response.ok && result.status === 'success') {
                closeModal();
                showPageAlert('Announcement created successfully!', 'success');
                fetchAnnouncements();
            } else {
                alertBox.style.display = 'block';
                alertBox.className = 'alert alert-error';
                alertBox.innerText = result.message || 'Failed to create announcement';
            }
        } catch (error) {
            alertBox.style.display = 'block';
            alertBox.className = 'alert alert-error';
            alertBox.innerText = 'Network error occurred.';
        }
    }

    async function deleteAnnouncement(id) {
        if (!confirm('Are you sure you want to delete this announcement?')) return;
        
        try {
            const response = await fetch(`/admin/api/delete_announcement/${id}`, {
                method: 'DELETE',
                headers: { 'token': token }
            });
            
            if (response.ok) {
                showPageAlert('Announcement deleted successfully.', 'success');
                fetchAnnouncements();
            } else {
                const res = await response.json();
                showPageAlert(res.message || 'Failed to delete announcement.', 'error');
            }
        } catch (error) {
            showPageAlert('Network error during deletion.', 'error');
        }
    }

    function showPageAlert(message, type) {
        const alertBox = document.getElementById('pageAlert');
        alertBox.style.display = 'block';
        alertBox.className = `alert alert-${type}`;
        alertBox.innerText = message;
        setTimeout(() => alertBox.style.display = 'none', 3000);
    }
</script>
{% endblock %}
